[tox]
env_list =
    format
    lint
    type
    py{310,311,312}
    core
    docs

[testenv:format]
description = check formatting with ruff
deps = ruff==0.17.4
skip_install = true
commands = ruff format --check {posargs:.}

[testenv:lint]
description = lint with ruff
deps = ruff==0.17.4
skip_install = true
commands = ruff check {posargs:.}

[testenv:type]
description = run type checks on src
deps = ty==0.0.99
commands = ty check {posargs:src}

[testenv:docs]
description = build the Sphinx documentation
extras = docs
commands = sphinx-build -W --keep-going -b html docs/source {envtmpdir}/html

[testenv:core]
description = core install without optional backends
# Clear the inherited `extras = dev` so the env stays bare.
extras =
deps = pytest
commands =
    python -c 'import importlib.util, sys; loaded = [n for n in ("spidev", "gpiozero") if importlib.util.find_spec(n) is not None]; sys.exit("core env has optional backends installed: " + ", ".join(loaded) if loaded else 0)'
    pytest tests/test_optional_backends.py {posargs}

[testenv]
description = install pytest in a virtual environment and invoke it on the tests folder
deps =
    pytest>=7
    pytest-sugar
extras = dev
commands = pytest tests {posargs}
