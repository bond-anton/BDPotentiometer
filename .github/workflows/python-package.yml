# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[dev,test]
    - name: Install with pip
      run: |
        pip install --force-reinstall --no-deps .
    - name: Verify installed wheel is importable
      working-directory: ${{ runner.temp }}
      run: |
        python -c "import pathlib, sys, BDPotentiometer; path = pathlib.Path(BDPotentiometer.__file__).resolve(); print(f'Imported {path}'); assert 'site-packages' in path.parts, path; assert 'gpiozero' not in sys.modules; assert 'spidev' not in sys.modules"
    - name: Verify wheel ships py.typed
      working-directory: ${{ runner.temp }}
      run: |
        python -m pip wheel "$GITHUB_WORKSPACE" -w "$RUNNER_TEMP/wheel" --no-deps
        python -c "import pathlib, zipfile; wheels = list(pathlib.Path('wheel').glob('*.whl')); assert len(wheels) == 1, wheels; names = zipfile.ZipFile(wheels[0]).namelist(); marker = 'BDPotentiometer/py.typed'; assert marker in names, marker; print(f'{marker} present in {wheels[0].name}')"
    - name: Test with pytest
      run: |
        pytest

  core:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install without optional backends
      run: |
        python -m venv "$RUNNER_TEMP/core-venv"
        "$RUNNER_TEMP/core-venv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/core-venv/bin/python" -m pip install .
    - name: Verify core import stays backend-free
      run: |
        "$RUNNER_TEMP/core-venv/bin/python" -c "import sys, BDPotentiometer, BDPotentiometer.mcp4xxx, scietex.hal.spi; assert 'gpiozero' not in sys.modules; assert 'spidev' not in sys.modules; print('core ok')"
