[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "BDPotentiometer"
dynamic = ["version"]
description = "BD Digital Potentiometer"
authors = [
  { name = "Anton Bondarenko", email = "bond.anton@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/bond-anton/BDPotentiometer"
"Bug Tracker" = "https://github.com/bond-anton/BDPotentiometer/issues"
"Documentation" = "https://bdpotentiometer.readthedocs.io"

[project.optional-dependencies]
gpiozero = ["gpiozero>=1.6.2"]
spi = ["spidev>=3.6"]
dev = ["gpiozero>=1.6.2", "spidev>=3.6", "numpy"]
docs = ["sphinx", "sphinx_rtd_theme", "gpiozero>=1.6.2", "numpy"]
test = ["pytest", "numpy"]
lint = ["ruff==0.17.4", "ty==0.0.99"]

[tool.setuptools.dynamic]
version = {attr = "BDPotentiometer.__version__"}

[tool.setuptools.package-data]
BDPotentiometer = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4","E7","E9","F","W","I","B","C4","SIM","UP","PLC0415","PLR0913","PLR0917"]
ignore = ["E501","SLF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false

[tool.ty.environment]
python-version = "3.9"

[tool.ty.analysis]
replace-imports-with-any = ["gpiozero.**", "spidev.**"]
